# docker compose example

version: "3"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # image: myapp:1.0
    container_name: app
    ports:
      - "8001:8000"
    volumes:
      - ../:/app                                  #disable for production
    depends_on:
      - mysql

  phpmyadmin:
    image: phpmyadmin:5.2.3
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
  mysql:
    image: mysql:8.0
    container_name: mysql
    # restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7
    ports:
      - "6379:6379"
      
volumes:
  mysql_data: